<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha Box - Custom Product Box Designer</title>
    <script src="https://unpkg.com/three@0.132.2/build/three.min.js"></script>
    <script src="https://unpkg.com/@google/model-viewer@1.12.0/dist/model-viewer.min.js"></script>
    <script src="https://unpkg.com/fabric@5.2.1/dist/fabric.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #64B5F6;
            --secondary-color: #E3F2FD;
            --accent-color: #1976D2;
        }
        .soft-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .canvas-container {
            border: 2px dashed #ccc;
            border-radius: 8px;
            min-height: 400px;
        }
        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .box-preview {
            width: 300px;
            height: 300px;
            background: #fff;
            position: relative;
        }
        #loginModal, #registerModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm">
        <div class="container mx-auto px-6 py-3">
            <div class="flex justify-between items-center">
                <div class="flex items-center">
                    <a href="#" class="text-2xl font-bold text-blue-600">Alpha Box</a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="#" class="text-gray-600 hover:text-blue-600" id="loginBtn">Login</a>
                    <a href="#" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700" id="registerBtn">Get Started</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="py-20 bg-gradient-to-r from-blue-50 to-indigo-50">
        <div class="container mx-auto px-6">
            <div class="flex flex-col md:flex-row items-center">
                <div class="md:w-1/2">
                    <h1 class="text-4xl md:text-6xl font-bold text-gray-800 mb-4">
                        Design Custom Product Boxes That Stand Out
                    </h1>
                    <p class="text-xl text-gray-600 mb-8">
                        Create professional packaging designs with our intuitive drag-and-drop editor and AI-powered suggestions
                    </p>
                    <button class="bg-blue-600 text-white px-8 py-3 rounded-lg hover:bg-blue-700 transition duration-300">
                        Start Designing Now
                    </button>
                </div>
                <div class="md:w-1/2 mt-10 md:mt-0">
                    <img src="https://images.unsplash.com/photo-1607082349566-187342175e2f" alt="Box Design" class="rounded-lg shadow-xl">
                </div>
            </div>
        </div>
    </section>

    <!-- Box Designer -->
    <section class="py-12 bg-white">
        <div class="container mx-auto px-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="canvas-container p-4" id="designCanvas">
                    <!-- Canvas will be inserted here by JavaScript -->
                </div>
                <div class="design-controls space-y-6">
                    <div class="bg-gray-50 p-6 rounded-lg">
                        <h3 class="text-lg font-semibold mb-4">Box Type</h3>
                        <div class="grid grid-cols-3 gap-4">
                            <button class="p-3 border rounded hover:bg-blue-50">Mailer</button>
                            <button class="p-3 border rounded hover:bg-blue-50">Folding</button>
                            <button class="p-3 border rounded hover:bg-blue-50">Rigid</button>
                        </div>
                    </div>
                    <div class="bg-gray-50 p-6 rounded-lg">
                        <h3 class="text-lg font-semibold mb-4">Customization</h3>
                        <div class="space-y-4">
                            <button class="w-full bg-blue-600 text-white p-3 rounded hover:bg-blue-700">
                                <i class="bi bi-cloud-upload"></i> Upload Logo
                            </button>
                            <button class="w-full bg-blue-600 text-white p-3 rounded hover:bg-blue-700">
                                <i class="bi bi-type"></i> Add Text
                            </button>
                            <button class="w-full bg-blue-600 text-white p-3 rounded hover:bg-blue-700">
                                <i class="bi bi-palette"></i> Change Colors
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- AI Search Section -->
    <section class="py-12 bg-gray-50">
        <div class="container mx-auto px-6">
            <h2 class="text-3xl font-bold text-center mb-8">Get AI-Powered Design Suggestions</h2>
            <div class="max-w-2xl mx-auto">
                <div class="flex items-center gap-4">
                    <input type="text" placeholder="Describe your brand style (e.g., eco-friendly minimal)" 
                           class="flex-1 p-4 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600">
                    <button class="bg-blue-600 text-white px-6 py-4 rounded-lg hover:bg-blue-700">
                        Generate Ideas
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- Login Modal -->
    <div id="loginModal" class="modal">
        <div class="bg-white p-8 rounded-lg w-96 mx-auto mt-20">
            <h2 class="text-2xl font-bold mb-6">Login to Alpha Box</h2>
            <form class="space-y-4">
                <input type="email" placeholder="Email" class="w-full p-3 border rounded">
                <input type="password" placeholder="Password" class="w-full p-3 border rounded">
                <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded">Login</button>
            </form>
        </div>
    </div>

    <!-- Register Modal -->
    <div id="registerModal" class="modal">
        <div class="bg-white p-8 rounded-lg w-96 mx-auto mt-20">
            <h2 class="text-2xl font-bold mb-6">Create Account</h2>
            <form class="space-y-4">
                <input type="text" placeholder="Full Name" class="w-full p-3 border rounded">
                <input type="email" placeholder="Email" class="w-full p-3 border rounded">
                <input type="password" placeholder="Password" class="w-full p-3 border rounded">
                <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded">Register</button>
            </form>
        </div>
    </div>

    <script>
        // Initialize Fabric.js canvas
        document.addEventListener('DOMContentLoaded', function() {
            const canvas = new fabric.Canvas('designCanvas', {
                width: 500,
                height: 500,
                backgroundColor: '#ffffff'
            });

            // Modal Handling
            const loginBtn = document.getElementById('loginBtn');
            const registerBtn = document.getElementById('registerBtn');
            const loginModal = document.getElementById('loginModal');
            const registerModal = document.getElementById('registerModal');

            loginBtn.addEventListener('click', () => {
                loginModal.style.display = 'block';
            });

            registerBtn.addEventListener('click', () => {
                registerModal.style.display = 'block';
            });

            window.addEventListener('click', (e) => {
                if (e.target === loginModal) loginModal.style.display = 'none';
                if (e.target === registerModal) registerModal.style.display = 'none';
            });

            // AI Integration
            async function generateDesignIdeas(prompt) {
                try {
                    const response = await fetch('https://r0c8kgwocscg8gsokogwwsw4.zetaverse.one/ai', {
                        method: 'POST',
                        headers: {
                            'Authorization': 'Bearer 8Yzp20C8wahFyhTzgisJYwWKdin1',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            messages: [
                                {
                                    role: 'user',
                                    content: [
                                        {
                                            type: 'text',
                                            text: `Generate box design suggestions for: ${prompt}`
                                        }
                                    ]
                                }
                            ]
                        })
                    });
                    const data = await response.json();
                    return data.message;
                } catch (error) {
                    console.error('Error generating design ideas:', error);
                    return 'Failed to generate design ideas. Please try again.';
                }
            }
        });
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
